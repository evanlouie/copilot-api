name: Apply issue 9

on:
  push:
    branches:
      - fix/issue-9-tool-choice-validation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-9-tool-choice-validation
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply and verify
        run: |
          cat .automation/issue-9.patch.part* > /tmp/issue-9.patch
          git apply --check /tmp/issue-9.patch
          git apply /tmp/issue-9.patch
          rm .automation/issue-9.patch.part* .github/workflows/apply-issue-9.yml
          rmdir .automation 2>/dev/null || true
          gofmt -w internal/openai/validation.go internal/openai/validation_test.go internal/toolproxy/toolproxy.go internal/toolproxy/responses_tools_test.go internal/httpapi/responses.go internal/httpapi/server_test.go
          go test ./internal/openai ./internal/toolproxy ./internal/httpapi ./internal/copilotgw -count=1
          go vet ./internal/openai ./internal/toolproxy ./internal/httpapi ./internal/copilotgw
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(tool_choice): reject silent catalog narrowing"
          git push origin HEAD:fix/issue-9-tool-choice-validation
