name: Apply issue 10

on:
  push:
    branches:
      - fix/issue-10-strict-tuple-items

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-10-strict-tuple-items
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply and verify
        run: |
          git apply --check .automation/issue-10.patch
          git apply .automation/issue-10.patch
          rm .automation/issue-10.patch .github/workflows/apply-issue-10.yml
          rmdir .automation 2>/dev/null || true
          gofmt -w internal/toolproxy/toolproxy.go internal/toolproxy/strict_tools_test.go internal/copilotgw/strict_enforcement_test.go
          go test ./internal/toolproxy ./internal/copilotgw -count=1
          go vet ./internal/toolproxy ./internal/copilotgw
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(strict): report tuple-form items as unenforceable"
          git push origin HEAD:fix/issue-10-strict-tuple-items
